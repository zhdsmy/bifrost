      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arcOuter" x1="40" y1="154" x2="200" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
