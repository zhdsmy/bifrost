  <circle cx="46" cy="176" r="10" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
  <circle cx="194" cy="176" r="10" fill="#F59E0B" stroke="#0F172A" stroke-width="4"/>
  <circle cx="120" cy="176" r="7" fill="#34D399"/>
