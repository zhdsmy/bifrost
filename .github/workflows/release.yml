# Release workflow for Bifrost plugin packages (PLAN section 16.4).
# Tag/branch validation and release publishing adapted from po0fw asus-merlin (MIT), commit 0d9532d.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, sign & publish Bifrost package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${GITHUB_REF_NAME} is not on main" >&2
            exit 1
          }

      - name: Check tag matches plugin version
        run: |
          version="$(tr -d ' \t\r\n' < plugin/bifrost/version)"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} != v${version}" >&2
            exit 1
          }

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to overwrite" >&2
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build web application
        working-directory: web
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run check
          npm run build

      - name: Package offline tarballs
        run: |
          core_tag="$(tr -d ' \t\r\n' < packaging/core-tag)"
          echo "Packaging with core release: ${core_tag}"
          packaging/build.sh --core-release "${core_tag}" --arch arm --web-dist web/dist --out dist
          rc=0
          packaging/build.sh --core-release "${core_tag}" --arch arm64 --web-dist web/dist --out dist || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "Core release ${core_tag} has no arm64 asset; publishing arm package only."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          cp LICENSE dist/LICENSE
          cp packaging/LICENSE.tailscale dist/LICENSE.tailscale

      - name: Generate and sign SHA256SUMS
        env:
          BIFROST_SIGNING_KEY: ${{ secrets.BIFROST_SIGNING_KEY }}
        run: |
          if [ -z "${BIFROST_SIGNING_KEY}" ]; then
            echo "error: secret BIFROST_SIGNING_KEY is not configured" >&2
            exit 1
          fi
          (cd dist && sha256sum bifrost-*.tar.gz > SHA256SUMS)
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "${BIFROST_SIGNING_KEY}" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out dist/SHA256SUMS.sig dist/SHA256SUMS
          rm -f "$key_file"
          verified=0
          for pub in plugin/bifrost/keys/*.pub.pem; do
            [ -f "$pub" ] || continue
            if openssl dgst -sha256 -verify "$pub" -signature dist/SHA256SUMS.sig dist/SHA256SUMS >/dev/null 2>&1; then
              verified=1
              break
            fi
          done
          if [ "$verified" -ne 1 ]; then
            echo "error: SHA256SUMS.sig failed verification against plugin/bifrost/keys/*.pub.pem" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bifrost-*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d ' \t\r\n' < plugin/bifrost/version)"
          core_tag="$(tr -d ' \t\r\n' < packaging/core-tag)"
          sums="$(cat dist/SHA256SUMS)"
          notes="$(cat <<EOF
          Bifrost v${version} — KoolCenter / Koolshare offline plugin package (HND).

          - Bundled core release: \`${core_tag}\`
          - Tested headscale version: \`v0.29.7\`
          - Tested skin: \`ASUSWRT\` (\`ROG\`, \`TUF\`, \`TS\` skins are not tested on hardware)
          - Licenses included: \`LICENSE\` (MIT) and \`LICENSE.tailscale\` (BSD-3-Clause)

          ### SHA256SUMS

          \`\`\`
          ${sums}
          \`\`\`

          Verify \`SHA256SUMS.sig\` with the public key in \`plugin/bifrost/keys/\`:

          \`\`\`sh
          openssl dgst -sha256 -verify <pubkey.pub.pem> -signature SHA256SUMS.sig SHA256SUMS
          \`\`\`
          EOF
          )"
          gh release create "${GITHUB_REF_NAME}" \
            dist/bifrost-*.tar.gz \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/LICENSE \
            dist/LICENSE.tailscale \
            --title "Bifrost v${version}" \
            --notes "${notes}"
