# Release workflow for Bifrost plugin packages (PLAN section 16.4).
# Security isolation: verification and npm/web build run in read-only jobs with
# persist-credentials: false and --ignore-scripts; signing, provenance
# attestation, and GitHub Release publishing run in a separate job that never
# executes npm/node code.
# Tag/branch validation and release publishing adapted from po0fw asus-merlin (MIT), commit 0d9532d.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    name: Verify tag, shell & install gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main and matches plugin version
        run: |
          set -eu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${GITHUB_REF_NAME} is not on main" >&2
            exit 1
          }
          version="$(tr -d ' \t\r\n' < plugin/bifrost/version)"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} != v${version}" >&2
            exit 1
          }

      - name: Run shell, privacy & BusyBox 1.25 install tests
        run: |
          set -eu
          tools/check-sh.sh
          tools/check-private.sh
          tests/shell/run.sh
          tests/install/run.sh

  build:
    name: Build web & package offline tarballs (read-only)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read Go version for embedded module inspection
        id: go-ver
        run: echo "version=$(jq -r .go core/recipe.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.go-ver.outputs.version }}
          cache: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build web application (no lifecycle scripts)
        working-directory: web
        run: |
          set -eu
          npm ci --include=dev --no-audit --no-fund --ignore-scripts
          npm run check
          npm run build

      - name: Package offline tarballs
        run: |
          set -eu
          core_tag="$(tr -d ' \t\r\n' < packaging/core-tag)"
          echo "Packaging with core release: ${core_tag}"
          packaging/build.sh --core-release "${core_tag}" --arch arm --web-dist web/dist --out dist
          rc=0
          packaging/build.sh --core-release "${core_tag}" --arch arm64 --web-dist web/dist --out dist || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "Core release ${core_tag} has no arm64 asset; shipping arm package only."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          for package in dist/bifrost-*.tar.gz; do
            python3 packaging/gen-core-notices.py --check-package "$package"
          done
          cp LICENSE dist/LICENSE
          cp packaging/LICENSE.tailscale dist/LICENSE.tailscale

      - name: Upload built release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bifrost-release-dist
          if-no-files-found: error
          path: |
            dist/bifrost-*.tar.gz
            dist/LICENSE
            dist/LICENSE.tailscale

  publish:
    name: Sign, attest & publish GitHub Release
    needs: [verify, build]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to overwrite" >&2
            exit 1
          fi

      - name: Download built release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bifrost-release-dist
          path: dist

      - name: Generate and sign SHA256SUMS
        id: sign
        env:
          BIFROST_SIGNING_KEY: ${{ secrets.BIFROST_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${BIFROST_SIGNING_KEY}" ]; then
            echo "error: secret BIFROST_SIGNING_KEY is not configured" >&2
            exit 1
          fi
          found_pub=0
          for pub in plugin/bifrost/keys/*.pub.pem; do
            [ -r "$pub" ] && found_pub=1
          done
          if [ "$found_pub" -ne 1 ]; then
            echo "error: no *.pub.pem public key found in plugin/bifrost/keys/" >&2
            exit 1
          fi
          (cd dist && LC_ALL=C sha256sum bifrost-*.tar.gz > SHA256SUMS)
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          (
            umask 077
            printf '%s\n' "${BIFROST_SIGNING_KEY}" > "$key_file"
          )
          tools/sign.sh "$key_file" dist/SHA256SUMS
          rm -f "$key_file"
          verified=0
          for pub in plugin/bifrost/keys/*.pub.pem; do
            [ -r "$pub" ] || continue
            if openssl dgst -sha256 -verify "$pub" -signature dist/SHA256SUMS.sig dist/SHA256SUMS >/dev/null 2>&1; then
              echo "public_key=$pub" >> "$GITHUB_OUTPUT"
              verified=1
              break
            fi
          done
          if [ "$verified" -ne 1 ]; then
            echo "error: SHA256SUMS.sig failed verification against plugin/bifrost/keys/*.pub.pem" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bifrost-*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          PUBLIC_KEY: ${{ steps.sign.outputs.public_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(tr -d ' \t\r\n' < plugin/bifrost/version)"
          core_tag="$(tr -d ' \t\r\n' < packaging/core-tag)"
          sums="$(cat dist/SHA256SUMS)"
          notes="$(cat <<EOF
          Bifrost v${version} — KoolCenter / Koolshare offline plugin package (HND).

          - Bundled core release: \`${core_tag}\`
          - Tested headscale version: \`v0.29.7\`
          - Designed for the ASUSWRT skin; firmware skins need hardware verification.
          - Licenses included: \`LICENSE\` (MIT), \`LICENSE.tailscale\` (BSD-3-Clause), and \`THIRD_PARTY_NOTICES.core.md\` inside each tarball

          ### SHA256SUMS

          \`\`\`
          ${sums}
          \`\`\`

          Verify \`SHA256SUMS.sig\` with the public key in \`plugin/bifrost/keys/\`:

          \`\`\`sh
          pubkey="${PUBLIC_KEY}"
          openssl dgst -sha256 -verify "\${pubkey}" -signature SHA256SUMS.sig SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS   # Linux
          shasum -a 256 -c --ignore-missing SHA256SUMS  # macOS
          \`\`\`
          EOF
          )"
          gh release create "${GITHUB_REF_NAME}" \
            dist/bifrost-*.tar.gz \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/LICENSE \
            dist/LICENSE.tailscale \
            --title "Bifrost v${version}" \
            --notes "${notes}"
